# ==========================================
# GITHUB ACTIONS CI/CD PIPELINE - CHATEAM
# ==========================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: chateam/platform

jobs:
  # ==========================================
  # LINTING Y FORMATEO
  # ==========================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # checkout@v4 clona con fetch-depth:1 por defecto → no hay histórico y
        # `git diff <base>...HEAD` no existe. El paso de formato valida solo el
        # diff, así que necesita el histórico.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # ESLint y tsc recorren un grafo grande: un solo controller arrastra ~4.000
    # ficheros de tipos (googleapis aporta 897, @redis 510, @sentry 330). Con el
    # heap por defecto de V8 (~2 GB) los dos vuelcan core SIN emitir diagnóstico,
    # que es indistinguible de "el step falló por un error de código". El runner
    # ubuntu-latest tiene 16 GB: 6 GB de heap le sobran y quitan la ambigüedad.
    - name: Run ESLint
      run: npm run lint
      env:
        NODE_OPTIONS: --max-old-space-size=6144

    # Solo los ficheros del diff. `format:check` sobre el árbol entero falla en
    # 1.400 ficheros (el repo nunca se formateó) y bloqueaba este job — y con él
    # build, integration-tests y los deploys, que dependen de `lint`. Formatear
    # todo de golpe arrasaría el git blame; así el árbol converge según se toca.
    # Ver scripts/format-check-diff.sh.
    - name: Check formatting (solo el diff)
      run: bash scripts/format-check-diff.sh

    # Ver la nota de ESLint. Si aun con 6 GB muriese, la salida NO es inmediata:
    # project references exige un grafo acíclico y hoy hay 13 imports invertidos
    # (services->controllers x2, services->routes x1, helpers|libs|utils->services
    # x10). Habría que romperlos antes. Medido el 2026-07-31, ver
    # audit/PLAN-VERIFICABILIDAD.md §2.A3.
    - name: TypeScript check
      run: npm run type-check
      env:
        NODE_OPTIONS: --max-old-space-size=6144

    - name: any-ratchet (bloquea 'any' nuevo)
      run: bash scripts/any-ratchet.sh

  # ==========================================
  # TESTS UNITARIOS
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chateam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run database migrations
      run: npm run db:migrate
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: chateam_test
        DB_USER: postgres
        DB_PASS: postgres

    - name: Run unit tests
      run: npm run test:unit
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: chateam_test
        DB_USER: postgres
        DB_PASS: postgres
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info

  # ==========================================
  # TESTS DE INTEGRACIÓN
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start services with Docker Compose
      run: |
        docker-compose -f docker-compose.test.yml up -d
        sleep 30

    - name: Run integration tests
      run: |
        docker-compose -f docker-compose.test.yml exec -T app npm run test:integration

    - name: Stop services
      run: docker-compose -f docker-compose.test.yml down

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level moderate

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ==========================================
  # BUILD DOCKER IMAGES
  # ==========================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==========================================
  # DEPLOY TO STAGING
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Aquí se agregarían los comandos específicos de deploy
        # Por ejemplo, usando kubectl, docker-compose, etc.

    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        sleep 30
        curl -f http://staging.chateam.com/health || exit 1

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ==========================================
  # DEPLOY TO PRODUCTION
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Comandos específicos de deploy a producción

    - name: Run health checks
      run: |
        echo "Running production health checks..."
        sleep 60
        curl -f https://api.chateam.com/health || exit 1
        curl -f https://app.chateam.com/health || exit 1

    - name: Notify successful deployment
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: '🚀 Production deployment successful!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ==========================================
  # PERFORMANCE TESTS
  # ==========================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run load tests
      run: |
        docker run --rm -v $(pwd)/tests/performance:/workspace \
          grafana/k6 run /workspace/load-test.js

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: tests/performance/results/
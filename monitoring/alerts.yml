# ==========================================
# CHATEAM PROMETHEUS ALERTING RULES
# ==========================================

groups:
  # ==========================================
  # APPLICATION PERFORMANCE ALERTS
  # ==========================================
  - name: chateam-application
    rules:
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: chateam-app
        annotations:
          summary: "High API response time detected"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.instance }}"
          runbook_url: "https://docs.chateam.com/runbooks/high-response-time"

      - alert: CriticalResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: critical
          service: chateam-app
        annotations:
          summary: "Critical API response time detected"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
          service: chateam-app
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      - alert: CriticalErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.10
        for: 1m
        labels:
          severity: critical
          service: chateam-app
        annotations:
          summary: "Critical error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      - alert: LowRequestThroughput
        expr: rate(http_requests_total[5m]) < 10
        for: 5m
        labels:
          severity: warning
          service: chateam-app
        annotations:
          summary: "Low request throughput detected"
          description: "Request rate is {{ $value }}/sec for {{ $labels.instance }}"

  # ==========================================
  # DATABASE PERFORMANCE ALERTS
  # ==========================================
  - name: chateam-database
    rules:
      - alert: DatabaseConnectionPoolFull
        expr: pg_stat_activity_count{state="active"} / pg_settings_max_connections > 0.8
        for: 2m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "Database connection pool near capacity"
          description: "{{ $value | humanizePercentage }} of database connections in use"

      - alert: DatabaseConnectionPoolCritical
        expr: pg_stat_activity_count{state="active"} / pg_settings_max_connections > 0.95
        for: 30s
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "Database connection pool critical"
          description: "{{ $value | humanizePercentage }} of database connections in use"

      - alert: DatabaseSlowQueries
        expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 5
        for: 3m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}s"

      - alert: DatabaseReplicationLag
        expr: pg_replication_lag_seconds > 60
        for: 2m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "Database replication lag detected"
          description: "Replication lag is {{ $value }}s"

      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "Database instance down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable"

  # ==========================================
  # REDIS CACHE ALERTS
  # ==========================================
  - name: chateam-redis
    rules:
      - alert: RedisHighMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value }}%"

      - alert: RedisCriticalMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 95
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis memory usage critical"
          description: "Redis memory usage is {{ $value }}%"

      - alert: HighQueueLength
        expr: redis_queue_length > 1000
        for: 10m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High queue length detected"
          description: "Queue length is {{ $value }} items"

      - alert: CriticalQueueLength
        expr: redis_queue_length > 5000
        for: 5m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Critical queue length detected"
          description: "Queue length is {{ $value }} items"

      - alert: RedisConnectionsHigh
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis connection count"
          description: "{{ $value }} clients connected to Redis"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis instance down"
          description: "Redis instance {{ $labels.instance }} is unreachable"

  # ==========================================
  # SYSTEM RESOURCE ALERTS
  # ==========================================
  - name: chateam-system
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical memory usage detected"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk usage detected"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }} at {{ $labels.mountpoint }}"

      - alert: CriticalDiskUsage
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical disk usage detected"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }} at {{ $labels.mountpoint }}"

  # ==========================================
  # SERVICE AVAILABILITY ALERTS
  # ==========================================
  - name: chateam-services
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute"

      - alert: ChateamAppDown
        expr: up{job="chateam-app"} == 0
        for: 30s
        labels:
          severity: critical
          service: chateam-app
        annotations:
          summary: "Chateam application is down"
          description: "Main Chateam application is unreachable"

      - alert: AuditServiceDown
        expr: up{job="chateam-audit"} == 0
        for: 1m
        labels:
          severity: warning
          service: audit
        annotations:
          summary: "Audit service is down"
          description: "AI audit service is unreachable - manual audits may be needed"

      - alert: WorkerDown
        expr: up{job="chateam-worker"} == 0
        for: 1m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "Background worker is down"
          description: "Background processing worker is unreachable"

  # ==========================================
  # BUSINESS METRICS ALERTS
  # ==========================================
  - name: chateam-business
    rules:
      - alert: HighFailedJobRate
        expr: rate(chateam_jobs_failed_total[5m]) / rate(chateam_jobs_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "High background job failure rate"
          description: "{{ $value | humanizePercentage }} of jobs are failing"

      - alert: FileExpirationJobFailed
        expr: chateam_file_expiration_job_last_success_timestamp < (time() - 7200)
        for: 1m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "File expiration job not running"
          description: "File expiration job hasn't succeeded in 2 hours"

      - alert: AttributionJobFailed
        expr: chateam_attribution_job_last_success_timestamp < (time() - 3600)
        for: 1m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "Attribution job not running"
          description: "Attribution retrofit job hasn't succeeded in 1 hour"

      - alert: StripeWebhookFailures
        expr: rate(chateam_stripe_webhook_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: billing
        annotations:
          summary: "Stripe webhook failures detected"
          description: "{{ $value }} Stripe webhook failures per second"

      - alert: HighTenantCreationFailures
        expr: rate(chateam_tenant_creation_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          service: tenant
        annotations:
          summary: "High tenant creation failure rate"
          description: "{{ $value }} tenant creations failing per second"

  # ==========================================
  # AI SERVICE ALERTS
  # ==========================================
  - name: chateam-ai
    rules:
      - alert: OpenAIRateLimitHit
        expr: increase(chateam_openai_rate_limit_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "OpenAI rate limit exceeded"
          description: "{{ $value }} OpenAI rate limit errors in last 5 minutes"

      - alert: HighAIAuditFailureRate
        expr: rate(chateam_ai_audit_failures_total[5m]) / rate(chateam_ai_audit_requests_total[5m]) > 0.2
        for: 3m
        labels:
          severity: warning
          service: audit
        annotations:
          summary: "High AI audit failure rate"
          description: "{{ $value | humanizePercentage }} of AI audits are failing"

      - alert: MetaAPIDown
        expr: rate(chateam_meta_api_errors_total[5m]) > 1
        for: 2m
        labels:
          severity: warning
          service: meta-marketing
        annotations:
          summary: "Meta API experiencing issues"
          description: "{{ $value }} Meta API errors per second"